name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # The CPU builds, as the tests use a small stand-in for DINO and the CUDA wheels
      # are a couple of gigabytes. torchvision comes from the same index, since timm
      # won't import with one built for another torch.
      - run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      - run: ruff check jwst_peculiar tests
      - run: ruff format --check jwst_peculiar tests
      - run: mypy jwst_peculiar tests
      - run: basedpyright
      - run: pytest -q

  # The tests alone on each system and on the oldest and newest Python it supports.
  systems:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - if: runner.os != 'macOS'
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      # not editable, so a module left out of the package fails here
      - run: pip install . pytest
      - run: pytest -q
      - run: jwst-peculiar objects --help

  viewer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
