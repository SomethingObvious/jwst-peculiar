name: Pages

# The demo is 74 MB of run data, so it lives as site.zip on the "demo" release
# instead of in git. Upload a new zip there, then run this by hand.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - run: gh release download demo --repo "$GITHUB_REPOSITORY" --pattern site.zip && unzip -q site.zip -d site
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
